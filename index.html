<!DOCTYPE html>
<html>

<head>

    <title>Cute Calculator</title>

    <style>

        /* ===== PAGE ===== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #ffd6e7, #d9c2ff);
        }


        /* ===== CALCULATOR ===== */

        .calculator {
            width: 360px;

            background-color: #292b2b;

            padding: 22px;

            border-radius: 30px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }


        /* ===== DISPLAY ===== */

        #display {
            width: 100%;
            height: 120px;

            background-color: #111;

            color: white;

            border: none;

            border-radius: 22px;

            margin-bottom: 25px;

            padding: 20px;

            font-size: 35px;

            text-align: right;

            outline: none;
        }


        /* ===== BUTTON AREA ===== */

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 14px;
        }


        /* ===== ALL BUTTONS ===== */

        button {
            height: 65px;

            border: none;

            border-radius: 15px;

            font-size: 25px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            background-color: #f3d9e5;

            color: #444;
        }


        /* ===== NUMBER BUTTONS ===== */

        .number {
            background-color: #fff0f6;
        }


        /* ===== OPERATOR BUTTONS ===== */

        .operator {
            background-color: #ff9fbd;

            color: white;
        }


        /* ===== EQUAL BUTTON ===== */

        .equal {
            background-color: #9b72ff;

            color: white;
        }


        /* ===== CLEAR BUTTON ===== */

        .clear {
            background-color: #ff6f91;

            color: white;
        }


        /* ===== HOVER ===== */

        button:hover {
            transform: scale(1.05);

            filter: brightness(1.05);
        }


        /* ===== CLICK ===== */

        button:active {
            transform: scale(0.95);
        }


        /* ===== ZERO BUTTON ===== */

        .zero {
            grid-column: span 2;
        }

    </style>

</head>


<body>


    <div class="calculator">


        <!-- DISPLAY -->

        <input
            type="text"
            id="display"
            value="0"
            readonly
        >


        <!-- BUTTONS -->

        <div class="buttons">


            <!-- CLEAR -->

            <button
                class="clear"
                onclick="clearDisplay()">
                C
            </button>


            <!-- OPERATORS -->

            <button
                class="operator"
                onclick="addToDisplay('/')">
                ÷
            </button>


            <button
                class="operator"
                onclick="addToDisplay('*')">
                ×
            </button>


            <button
                class="operator"
                onclick="addToDisplay('-')">
                −
            </button>


            <!-- NUMBERS -->

            <button
                class="number"
                onclick="addToDisplay('7')">
                7
            </button>


            <button
                class="number"
                onclick="addToDisplay('8')">
                8
            </button>


            <button
                class="number"
                onclick="addToDisplay('9')">
                9
            </button>


            <button
                class="operator"
                onclick="addToDisplay('+')">
                +
            </button>


            <button
                class="number"
                onclick="addToDisplay('4')">
                4
            </button>


            <button
                class="number"
                onclick="addToDisplay('5')">
                5
            </button>


            <button
                class="number"
                onclick="addToDisplay('6')">
                6
            </button>


            <button
                class="number"
                onclick="addToDisplay('.')">
                .
            </button>


            <button
                class="number"
                onclick="addToDisplay('1')">
                1
            </button>


            <button
                class="number"
                onclick="addToDisplay('2')">
                2
            </button>


            <button
                class="number"
                onclick="addToDisplay('3')">
                3
            </button>


            <!-- EQUAL -->

            <button
                class="equal"
                onclick="calculate()">
                =
            </button>


            <button
                class="number zero"
                onclick="addToDisplay('0')">
                0
            </button>


        </div>

    </div>


    <script>


        // Get the display

        let display = document.getElementById("display");


        // Add number or operator to display

        function addToDisplay(value) {

            if (display.value === "0") {

                display.value = value;

            } else {

                display.value += value;

            }

        }


        // Clear calculator

        function clearDisplay() {

            display.value = "0";

        }


        // Calculate answer

        function calculate() {

            try {

                display.value = eval(display.value);

            }

            catch {

                display.value = "Error";

            }

        }

    </script>


</body>

</html>
